name: Deploy Vylos Website to GitHub Pages

# Manual trigger only (triggered via `npm run web` -> `gh workflow run pages.yml`).
# Does NOT run automatically on git push.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment trigger source'
        required: false
        default: 'Triggered via npm run web'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
